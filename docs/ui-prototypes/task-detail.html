<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Граф ролей и этапов на карточке задачи · прототип экрана задачи</title>
<style>
:root{--bg:#0c0f13;--card:#141a21;--card2:#10151b;--inset:#0b0e12;--line:#242e39;
 --ink:#e9eef4;--dim:#8b97a6;--dim2:#5b6673;--pass:#3ecf8e;--now:#f5b544;
 --stop:#f0616d;--human:#7aa7ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
 font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(12,15,19,.95);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 26px 12px;
 display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
h1{margin:0;font-size:18px;font-weight:600;line-height:1.25;max-width:74ch}
.meta{margin-top:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
 font-size:11px;color:var(--dim2)}
.meta .id{font-family:var(--mono)}
.meta .sep{opacity:.4}
.hero{display:flex;gap:10px;align-items:flex-start}
.badge{font-size:11px;font-weight:650;padding:3px 9px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.b-now{color:var(--now);background:rgba(245,181,68,.1);border-color:rgba(245,181,68,.3)}
.b-stop{color:var(--stop);background:rgba(240,97,109,.1);border-color:rgba(240,97,109,.3)}
.b-human{color:var(--human);background:rgba(122,167,255,.1);border-color:rgba(122,167,255,.3)}
.b-pass{color:var(--pass);background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3)}
.b-mute{color:var(--dim);background:#1a222b;border-color:var(--line)}
.runchip{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 9px;border-radius:6px;
 border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.runchip i{width:6px;height:6px;border-radius:50%;background:#39434f}
.runchip.run{color:var(--pass);border-color:rgba(62,207,142,.35);background:rgba(62,207,142,.08)}
.runchip.run i{background:var(--pass);animation:blink 1.3s infinite}
.runchip.stop{color:var(--stop);border-color:rgba(240,97,109,.35);background:rgba(240,97,109,.08)}
.runchip.stop i{background:var(--stop)}
.runchip.warn{color:var(--now);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.08)}
.runchip.warn i{background:var(--now)}
@keyframes blink{50%{opacity:.2}}
.tokens{text-align:right;min-width:180px}
.tokens .n{font-size:26px;font-weight:650;letter-spacing:-.4px;line-height:1}
.tokens .n small{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:0}
.tokens .sub{font-size:11px;color:var(--dim2);margin-top:5px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;width:180px;margin-left:auto}
.bar i{display:block;height:100%}

main{padding:16px 26px 80px;max-width:1400px}
.steps{position:relative;padding-left:0}
.step{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.rail{position:absolute;left:21px;top:34px;bottom:-2px;width:2px;background:#1f2833}
.step.done .rail{background:linear-gradient(#2f9d6e,#1f4f3c)}
.step:last-child .rail{display:none}
.nodebox{display:flex;justify-content:center;padding-top:12px;position:relative;z-index:2}
.node{width:18px;height:18px;border-radius:50%;background:#171e26;border:2px solid #2f3a46;
 display:flex;align-items:center;justify-content:center;font-size:9px;color:#0c0f13}
.step.done .node{background:var(--pass);border-color:var(--pass)}
.step.now .node{width:24px;height:24px;margin-top:-3px;background:var(--now);border-color:#ffe0a8;
 box-shadow:0 0 0 5px rgba(245,181,68,.12),0 0 16px rgba(245,181,68,.45);animation:pulse 2s infinite}
.step.gate .node{border-radius:3px;transform:rotate(45deg)}
.step.gate .node span{transform:rotate(-45deg)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(245,181,68,.12),0 0 14px rgba(245,181,68,.3)}
 50%{box-shadow:0 0 0 9px rgba(245,181,68,.04),0 0 20px rgba(245,181,68,.5)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
 margin-bottom:8px;overflow:hidden;min-width:0}
.code .cap span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:75%}
.head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
 padding:9px 16px;cursor:pointer;user-select:none}
.head:hover{background:#172028}
.t1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{font-size:13.5px;font-weight:600}
.ver{font-family:var(--mono);font-size:10.5px;color:var(--dim2)}
.chip{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;
 padding:1px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.hot{color:var(--now);border-color:rgba(245,181,68,.3)}
.chip.bad{color:var(--stop);border-color:rgba(240,97,109,.3)}
.chip.good{color:var(--pass);border-color:rgba(62,207,142,.3)}
.t2{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--dim2);
 font-variant-numeric:tabular-nums}
.caret{color:var(--dim2);transition:transform .15s}
.step.open .caret{transform:rotate(90deg)}
.body{display:none;border-top:1px solid var(--line);padding:0}
.step.open .body{display:block}

.tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card2)}
.tab{font-size:11.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);
 color:var(--dim);cursor:pointer}
.tab.on{color:var(--ink);background:#1b242e;border-color:#33414f}
.tab b{color:var(--now);font-weight:600}
.panel{display:none;padding:14px 16px 18px}
.panel.on{display:block}

.lead{color:#cfd8e2;font-size:13px;line-height:1.5;max-width:95ch}
.lead.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:11px;color:var(--human);cursor:pointer;margin-top:6px;display:inline-block}

.req{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--card2)}
.req .rid{font-family:var(--mono);font-size:11px;color:var(--human)}
.req .st{margin-top:4px;font-size:12.5px;color:#dbe3ec;line-height:1.45}
.ac{margin:8px 0 0;padding-left:16px;color:var(--dim);font-size:12px}
.ac li{margin-bottom:3px}
.oq{margin-top:8px;border-left:2px solid var(--now);padding:4px 0 4px 10px;background:rgba(245,181,68,.04)}
.oq .q{font-size:12px;color:#e8dcc4}
.oq .p{font-size:11.5px;color:var(--now);margin-top:3px}
.sec{margin:14px 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.ul{margin:6px 0 0;padding-left:16px;color:var(--dim);font-size:12px}

.code{margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--inset)}
.code .cap{font-family:var(--mono);font-size:10.5px;color:var(--dim2);padding:5px 10px;
 border-bottom:1px solid var(--line);background:#0f1318;display:flex;justify-content:space-between}
.code pre{margin:0;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:11.5px;
 line-height:1.55;color:#c5d0dc}
.code pre .ln{color:#3d4a58;user-select:none;display:inline-block;width:2.4em}

.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:12px}
.kv .k{color:var(--dim2)}
.kv .v{color:#d3dce6;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.item{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--dim)}
.item .n{font-family:var(--mono);color:#9fb0c2;min-width:2.2em}
.item .t{color:#d3dce6}
.empty{color:var(--dim2);font-size:12px}
details summary{cursor:pointer;color:var(--dim2);font-size:11.5px;margin-top:8px}
details[open] summary{color:var(--dim)}
.raw{margin-top:8px;background:var(--inset);border:1px solid var(--line);border-radius:8px;
 padding:10px;font-family:var(--mono);font-size:11px;color:#9fb0c2;white-space:pre;overflow:auto;max-height:340px}
.note{font-size:11px;color:var(--dim2);margin-top:6px}
</style></head><body>

": 10551680, "total": 10799261, "cost": 0.11447754000000004, "calls": 82, "model": "deepseek-flash"}}, {"id": "01a1cade", "status": "COMPLETED", "attempt": 1, "summary": null, "error": "", "usage": {"in": 362781, "out": 25391, "cached": 312704, "total": 388172, "cost": 0.023684262, "calls": 11, "model": "deepseek-flash"}}], "kind": "role", "body": {"spec": {"paragraph": "Сейчас статус задачи читается по строке этапов: видно, где дело стоит, но не видно, кто работал, что уже сделано и где ждёт человек, а списки начинаются с идентификаторов, хотя человеческие имена у задач и артефактов есть. Что изменится: карточка получит схему рабочего пути из ролей, объявленных процессом и уже запускавшихся, плюс человеческие подписи там, где процесс объявляет решение по документу — сегодня это подпись требований и подпись качества, но список не зашит. Связи появятся только по сохранённым фактам и только между существующими узлами: сразу после подписи требований, пока исполнитель не запускался, подпись видна самим актом, а не стрелкой в пустоту. Такое положение тоже читается: этап помечен как текущий, узла «сейчас» нет — карточка не остаётся пустой и не обещает роль, которая ещё не стартовала. Пройденное, текущее и предстоящее будут различаться сразу; рядом — кто исполняет, сколько было кругов доработки и открытых блокирующих вопросов. Во всех списках первым встанет человеческое имя, идентификатор уйдёт в приглушённую вторую позицию. Состояния и переходы не меняются.", "requirements": [{"id": "REQ-RG-01", "statement": "Карточка получает весь путь задачи одной операцией чтения и только раскладывает готовое: этапы со статусами, узлы, рёбра, позицию, петлю доработки, число кругов, идущие прогоны, ожидания человека, число блокирующих вопросов, примечания. Перечни закрыты: позиция — узел, этап, удержание, вне графа; якорь — роль, гейт, этап, финал; причина вне графа — черновик, отменена, нет состояния возврата; этап — пройдено, сейчас, ещё не было; узел — роль, гейт, финал; статус узла — пройдено, сейчас, ожидается; ребро — передача, подпись, отказ, возврат, приёмка; носитель — артефакт, решение, событие.", "ac": ["Один вызов отдаёт все части модели; повторный на неизменных данных отличается только меткой снимка; чтение ничего не пишет.", "Все поля есть всегда; каждый вид позиции достижим: задача уже на этапе, а роль этого этапа ещё не исполнялась, получает вид «этап» с якорем-этапом и без узла «сейчас»; значение вне перечня не принимается; свободная строка вместо перечня — отказ формы.", "Порядок этапов и подписи не живут в интерфейсе: подмена порядка в ответе меняет картинку без правок; новых таблиц и миграций нет.", "Каждый источник фактов читается один раз; внутри перебора узлов и рёбер чтений нет."], "oq": []}, {"id": "REQ-RG-02", "statement": "Узел — только объявленное процессом и подтверждённое сохранённым фактом. Узел роли есть ровно при её исполнении по задаче, один на роль; объявленная, но не исполнявшаяся роль узла не получает; необъявленная — никогда: её прогон виден в идущих и в примечании. Человеческий гейт рождается из объявления: его даёт состояние, объявляющее человеческий акт над документом; запуск дела и выход из удержания гейтами не являются, поэтому число гейтов не зашито. Показ гейта — из политики ожидания: требование и подсказка (первая объявленная команда с реальным идентификатором); ждёт подписи — только когда гейт текущая позиция; подписываемо — ждёт и есть действующий документ (спека или отчёт качества); предъявление считается всегда: действующий документ, иначе последний с пометкой; нет записи — громкий отказ конфигурации. Подпись узла — имя роли из определения и версия (идущего прогона, иначе свежайшая по старту и идентификатору). Статус: пройдено — артефакт роли или утвердительный человеческий акт (подпись, приёмка); сейчас — только узел позиции; иначе ожидается; отозванный результат — отдельный признак. Финал — только у принятой задачи.", "ac": ["Задача с одной действующей спекой: узел аналитика пройден, оба объявленных гейта ожидаются, других узлов нет; роль с исполнением без артефакта узел сохраняет как ожидаемый.", "Две завершённые версии роли: подпись по свежей, перечень исполнений — обе; версия идущего прогона побеждает.", "Роль вне объявленного процесса узла не даёт: прогон в идущих и в примечании «прогон вне пути»; артефакт без исполнения узла не создаёт.", "Гейты и финал несут пустые роль, версию, исполнения и прогон; новый человеческий этап в объявлении даёт новый гейт без правок интерфейса.", "Утверждение с действующей спекой: требование побайтно равно политике, подсказка — первой объявленной команде, ждёт и подписываемо, предъявление действующее; без действующей спеки — ждёт, но не подписываемо, предъявление — последняя спека с пометкой.", "Гейт вне позиции не ждёт и не подписываем; удержание с возвратом на гейт не теряет ни подписи, ни предъявления.", "Отозванный результат не делает узел пройденным; перечни печатаются целиком, без «+N ещё»."], "oq": []}, {"id": "REQ-RG-03", "statement": "Позиция одна и выводится из состояния задачи и сохранённых фактов. Вид позиции закрыт: узел — место названо узлом; удержание — задача припаркована, и место возврата существует узлом; этап — место названо этапом, а узла «сейчас» нет, в том числе удержание, чей узел возврата не существует; вне графа — черновик, отменённая, отсутствие сохранённого возврата. Якорь этапа роли — её узел, если он есть; если объявленный этап узла не дал, якорь — этап и узла «сейчас» нет. На человеческом этапе якорь — гейт; где работают и роль, и человек, — роль, пока идёт прогон, иначе гейт подписи. Удержание стоит на узле состояния возврата, если он есть, иначе — на этапе возврата без узла «сейчас». Черновик и отменённая — вне графа; принятая — финал. Этапы до позиции пройдены, позиция — сейчас, после — ещё не было. Текущий узел один либо ни одного; идущий прогон позицию не двигает.", "ac": ["Матрица всех состояний: вид, якорь, этап, узел; все поля позиции есть всегда; при заданном узле ровно один текущий, иначе ни одного; вид «этап» равносилен якорю-этапу и отсутствию узла «сейчас».", "Сразу после подписи требований, пока исполнитель не запускался: вид «этап», якорь — этап, узла «сейчас» нет, подпись видна актом гейта; после первого исполнения узел становится текущим, вид — «узел».", "Удержание с возвратом на утверждение: позиция — гейт утверждения, он текущий; с возвратом на доработку — узел исполнителя, если он есть, иначе вид «этап» на этапе доработки.", "Черновик: все этапы «ещё не было», рёбер нет; отменённая — ни одного текущего; принятая — финал текущий, а без сохранённого акта принятия карточка сообщает о расхождении данных.", "Прогон вне позиции позицию не двигает: он в идущих и в примечании, после закрытия примечание пусто; узла «доработка» нет."], "oq": []}, {"id": "REQ-RG-04", "statement": "Ребро есть только при сохранённом факте, всегда между существующими узлами, и несёт ровно один носитель — артефакт, решение или событие. Связи: потребление — исполнение называет артефакт, ребро от производителя к потребителю; вердикт проверки — «принято» к гейту утверждения, иной — к узлу аналитика; отчёты реализации и качества — от узла своей роли к гейту подписи, у роли нет узла — ребра нет; человеческие акты — подпись требований (гейт к исполнителю), отказ (гейт к аналитику), возврат (гейт к исполнителю), приёмка (гейт к финалу). Ребро подписи к исполнителю появляется только когда его конец существует: до первого исполнения подпись видна актом гейта и позицией.", "ac": ["Публикация спеки даёт передачу аналитик→проверяющий только когда проверяющий исполнялся и спека была у него во входе; при ручной проверке ребра нет.", "«Принято» от проверяющего — одно ребро к гейту утверждения; «нужна доработка» — к узлу аналитика; вердикт без узла — примечание и ноль рёбер.", "До первого исполнения ребра подписи к исполнителю нет; после него оно появляется, не переписывая решение; отказ идёт к аналитику, приёмка — к финалу, возврат — к исполнителю.", "Каждый отчёт качества и реализации даёт своё ребро к гейту подписи; повторный отчёт добавляет ребро, не переписывая прежнее; у ребра оба конца есть в узлах и ровно один носитель.", "Отозванный отчёт качества не даёт нового ребра подписи: ребро остаётся у породившего его отчёта."], "oq": []}, {"id": "REQ-RG-05", "statement": "Петля доработки — отдельный контур по сохранённым фактам; узла «доработка» нет. Счётчик возвратов равен числу сохранённых актов возврата; каждый возврат — ребро от гейта подписи качества к узлу исполнителя с номером круга (1..N без пропусков); обратный ход — ребро отчёта реализации к гейту. Контур рисуется при хотя бы одном возврате и остаётся после выхода в проверку качества и после приёмки. Пустая доработка паркует задачу ожиданием ответа, ставит сохранённый возврат «доработка» и открывает один блокирующий вопрос; ратификация закрывает круг без нового возврата. Число блокирующих вопросов — факт плоскости вопросов задачи: это открытые блокирующие вопросы задачи, где бы задача ни стояла; оно не принадлежит ни гейту, ни позиции и равно нулю тогда и только тогда, когда открытых блокирующих нет.", "ac": ["Число возвратов равно числу рёбер возврата и старшему номеру круга; при нуле возвратов рёбер и контура нет; номера идут 1..N без пропусков.", "После возврата задача в проверке качества: возвратов больше нуля, признак активной доработки ложен, контур сохранён; после приёмки контур остаётся.", "Пустая доработка: задача ждёт ответа с сохранённым возвратом на доработку, блокирующий вопрос открыт, его число — один; после ответа или ратификации открытых блокирующих нет — ноль.", "Число блокирующих вопросов нигде не выводится из позиции или гейта: оба вида ожидания считают по одним и тем же сохранённым вопросам.", "Узла «доработка» нет ни при каком состоянии; счётчик кругов приходит готовым и в интерфейсе не считается."], "oq": []}, {"id": "REQ-RG-06", "statement": "Панель пайплайна карточки заменяется панелью графа: ось этапов со статусами, узлы в порядке этапов, рёбра с подписью носителя, полные перечни исполнений и артефактов узла, кто исполняет сейчас (имя роли, версия, агент), ожидание человека (требование политики, подсказка, признак подписи, предъявление), число блокирующих вопросов, число кругов, контур петли, примечания. Пройдено, сейчас и дальше различаются статусом без легенды и наведения; плотность — компоновкой, а не скрытием данных. Интерфейс не хранит порядок этапов, словарь подписей и цвета статусов и не пересчитывает данные.", "ac": ["Прежняя линейка этапов удалена; текст «вне линейки» заменён причиной.", "Статусы различимы чипом и словом; наведение не требуется; тултипов, внутренней прокрутки и «+N ещё» нет.", "Контур доработки отделён от оси; число кругов и открытых блокирующих вопросов видны без раскрытия; второго индикатора статуса нет.", "Позиция на этапе без узла читается: этап отмечен как текущий, узла «сейчас» нет, акт гейта виден по фактам — карточка не пуста и не рисует стрелку в ещё не запущенную роль.", "В интерфейсе нет таблицы «состояние → узел», порядка этапов и словаря подписей: ответ с другим порядком отрисовывается без правок; смежные панели не меняются.", "Сборка и тесты интерфейса зелёные; новых зависимостей нет."], "oq": []}, {"id": "REQ-NM-01", "statement": "Где заголовком или первой колонкой стоит идентификатор, первой печатается человеческая подпись, а идентификатор — вторым, приглушённо. Точки: активные исполнения, шапка ожидания, заголовок спеки на утверждении, вопрос, перечень артефактов карточки, заголовок отчёта качества. Подписи приходят готовыми: имя задачи по правилу платформы (человеческое имя, иначе первая фраза постановки, иначе формальный заголовок), имя роли — «имя и версия», подпись артефакта — «человеческое название вида · vN» по декларативной таблице, правимой без пересборки. Подпись не хранится в артефакте и не переписывает хранимое имя; список задач, проектов и уведомления уже соответствуют.", "ac": ["В активных первой в колонке задачи стоит имя задачи ссылкой, короткий идентификатор рядом приглушённо; в колонке роли — «имя и версия», совпадающее с подписью узла.", "Шапка ожидания печатает имя задачи; формальный заголовок — вторичной пометкой, когда отличается.", "Заголовки спеки и отчёта качества — подпись по виду и версии, не ключ вида и не «артефакт <идентификатор>»; в вопросе первым идёт текст, идентификатор — в конце.", "Формат «название · vN» проверен на всех объявленных видах и версиях 1..3; форматтер один; таблиц «ключ → подпись» в интерфейсе и командной строке нет; подпись есть во всех ответах с артефактом.", "Таблица покрывает все объявленные виды: неполная — громкий отказ конфигурации; заголовком нигде не выводятся идентификатор и технический ключ вида.", "Интерфейс не склеивает имена и не пересчитывает; регресс-тесты фиксируют порядок имя→идентификатор в списках задач, проектов и уведомлений."], "oq": []}], "common": ["Имена ролей в определениях английские. Предлагаю: показывать имя из определения как есть, ключ — приглушённо; локализацию не вводить.", "Русские слова для видов артефактов — содержание декларативной таблицы. Предлагаю: спека, отчёт проверки, план реализации, отчёт реализации, патч, отчёт тестов, отчёт качества, запись решения, профиль проекта, прочее — авторизовать при подписи.", "Печатать ли граф в командной строке? Предлагаю: не печатать здесь — командный прогресс как есть, паритет отдельной задачей."], "assumptions": ["Допущение: гейтов сегодня два, но число следует из объявления процесса: гейт даёт состояние, объявляющее человеческий акт над документом; запуск дела и выход из удержания гейтами не являются.", "Допущение: «пройдено» значит «подтверждено фактом»; отказ и возврат видны ребром, но гейт пройденным не делают; статус этапа позиционный.", "Допущение: блокирующие вопросы — факт плоскости вопросов задачи, а не гейта и не позиции; их число равно открытым блокирующим вопросам задачи, где бы она ни стояла.", "Допущение: если объявленный этап не дал узла роли, вид позиции — «этап» с якорем-этапом и без узла «сейчас»; то же для удержания, чей узел возврата не существует.", "Допущение: подписи гейтов — из политики ожидания; свежесть исполнения — максимум по времени старта и идентификатору; таблица видов покрывает все объявленные виды, иначе отказ конфигурации."], "unknowns": ["Не проверено: у скольких задач есть отчёт проверки без вердикта и наоборот; у всех ли исполнений заполнен перечень входов.", "Не проверено, есть ли определения ролей для всех исторических пар «роль и версия»; без определения подпись падает на технический ключ.", "Не проверено, сохранены ли события переходов у всех исторических задач; без события этап получает «ещё не было»; размер ответа не измерен.", "Не проверено, сколько задач стоят на этапе без единого исполнения роли: первая такая задача и проверяет вид позиции «этап»."]}}}, {"state": "REVIEW", "word": "ревью", "role": "requirements-reviewer", "roleWord": "ревьюер", "title": "ревью", "version": 6, "label": "Requirements/Architecture Reviewer", "gate": false, "status": "passed", "statusWord": "пройдено", "attempts": 88, "limit": null, "tokens": 2709386, "cost": 0.10349980800000001, "calls": 62, "span": "4 д 17 ч → 15 ч 41 мин", "duration": "97 ч 40 м", "inContract": "requirements-specification@4", "outContract": "review-report@2", "produced": [{"kind": "REVIEW_REPORT", "seq": 1, "status": "STALE", "size": 12496, "display": "отчёт проверки · v1"}, {"kind": "REVIEW_REPORT", "seq": 2, "status": "STALE", "size": 9405, "display": "отчёт проверки · v2"}, {"kind": "REVIEW_REPORT", "seq": 3, "status": "STALE", "size": 12313, "display": "отчёт проверки · v3"}, {"kind": "REVIEW_REPORT", "seq": 4, "status": "STALE", "size": 8271, "display": "отчёт проверки · v4"}, {"kind": "REVIEW_REPORT", "seq": 5, "status": "STALE", "size": 13606, "display": "отчёт проверки · v5"}, {"kind": "REVIEW_REPORT", "seq": 6, "status": "STALE", "size": 13000, "display": "отчёт проверки · v6"}, {"kind": "REVIEW_REPORT", "seq": 7, "status": "STALE", "size": 15029, "display": "отчёт про const CUR = 5;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = n => !n ? '0' : n >= 1e9 ? (n/1e9).toFixed(2)+' млрд'
  : n >= 1e6 ? (n/1e6).toFixed(1)+' млн' : n >= 1e3 ? Math.round(n/1e3)+' тыс' : String(n);

function code(c){
  if (!c || !c.code) return '';
  const lines = c.code.split('\n');
  return `<div class="code"><div class="cap"><span>${esc(c.path)}:${c.line}</span>
    <span>${lines.length} стр</span></div><pre>${
    lines.map((l,i)=>`<span class="ln">${c.line+i}</span>${esc(l)}`).join('\n')}</pre></div>`;
}

function specPanel(b){
  const s = b.spec;
  let h = `<div class="lead clamp" id="lead">${esc(s.paragraph)}</div>
    <span class="more" onclick="document.getElementById('lead').classList.toggle('clamp');this.textContent=this.textContent.startsWith('весь')?'свернуть':'весь абзац'">весь абзац</span>`;
  h += `<div class="sec">требования · ${s.requirements.length}</div>`;
  s.requirements.forEach(r=>{
    h += `<div class="req"><div class="rid">${esc(r.id)}</div>
      <div class="st">${esc(r.statement)}</div>`;
    if (r.ac.length) h += `<ul class="ac">${r.ac.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`;
    (r.oq||[]).forEach(o=>{
      const [q, p] = splitP(o.text);
      h += `<div class="oq"><div class="q">${esc(q)}</div>${p?`<div class="p">${esc(p)}</div>`:''}</div>`;
    });
    h += '</div>';
  });
  if (s.common.length){
    h += `<div class="sec">вопросы без привязки к пункту · ${s.common.length}</div>
      <div class="note" style="margin:-2px 0 6px">в контракте спеки у вопроса нет поля «к какому пункту»:
      показываем рядом со списком требований, а не у пункта. Чтобы вопросы стояли у своих пунктов,
      контракт должен нести ссылку на требование.</div>`;
    s.common.forEach(o=>{ const [q,p]=splitP(o);
      h += `<div class="oq"><div class="q">${esc(q)}</div>${p?`<div class="p">${esc(p)}</div>`:''}</div>`; });
  }
  if (s.assumptions.length) h += `<details><summary>допущения · ${s.assumptions.length}</summary>
    <ul class="ul">${s.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></details>`;
  if (s.unknowns.length) h += `<details><summary>не проверено · ${s.unknowns.length}</summary>
    <ul class="ul">${s.unknowns.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></details>`;
  return h;
}
function splitP(t){
  const i = t.indexOf('Предлагаю');
  return i < 0 ? [t, ''] : [t.slice(0,i).trim(), t.slice(i).trim()];
}

    h += `<div class="sec">${esc(g.title)} · ${g.items.length}</div>`;
    g.items.forEach(i=>{
      const sc = (i.score!=null? `балл ${i.score}` : 'балл —') + (i.weight!=null? ` · вес ${i.weight}` : '');
      h += `<div class="req"><div class="rid">${esc(i.id||'')} ${i.kind?`· ${esc(i.kind)}`:''}
        <span style="color:var(--dim2)">· ${esc(sc)}</span></div>
        ${i.summary?`<div class="st">${esc(i.summary)}</div>`
          :`<div class="st" style="color:var(--dim2)">${esc(i.reason||'')}</div>`}
        ${(i.codes||[]).map(code).join('')}</div>`;
    });
  });
  if (q.report) h += `<details><summary>машинный текст отчёта</summary><div class="raw">${esc(q.report)}</div></details>`;
  return h;
}

function ioPanel(s, which){
  const c = which === 'in' ? s.inContract : s.outContract;
  let h = '<div class="kv">';
  if (c && c.name) h += `<div class="k">контракт</div><div class="v">${esc(c.name+'@'+(c.version||''))}</div>`;
  h += `<div class="k">роль</div><div class="v">${esc(s.role||'человек')}${s.version?'@v'+s.version:''}</div>`;
  if (which === 'in'){
    h += `<div class="k">получает</div><div class="v">${s.state==='ANALYSIS'?'постановку задачи':s.state==='REVIEW'?'спеку аналитика':s.state==='IMPLEMENTATION'?'утверждённую спеку и решения человека':s.state==='QA'?'отчёт реализации и изменение':'решение человека'}</div>`;
  } else {
    h += `<div class="k">отдаёт</div><div class="v">${s.produced.length?s.produced.map(p=>esc(p.display||p.kind)).join(', '):'ничего (решение человека)'}</div>`;
  }
  h += '</div>';
  if (s.produced.length && which === 'out'){
    h += `<div class="sec">артефакты стадии</div><div class="list">${
      s.produced.map(p=>`<div class="item"><span class="t">${esc(p.display||p.kind)}</span>
        <span class="n">${esc(p.status)}</span><span class="n">${Math.round(p.size/1024)} КБ</span></div>`).join('')}</div>`;
  }
  h += `<div class="sec">прогоны · ${s.attempts}</div>`;
  if (!s.execs.length) h += '<div class="empty">прогонов не было — этот шаг решает человек</div>';
  else h += `<div class="list">${s.execs.map(e=>
    `<div class="item"><span class="n">#${e.attempt??''}</span>
      <span class="t">${esc(e.status)}</span>
      <span class="n">${e.usage? fmtT(e.usage.total)+' ток':''}</span>
      <span class="n">${esc((e.summary||'').slice(0,80))}</span></div>`).join('')}</div>`;
  if (s.execs.length && s.execs[s.execs.length-1].error)
    h += `<div class="code"><div class="cap"><span>последний отказ</span></div><pre>${esc(s.execs[s.execs.length-1].error)}</pre></div>`;
  return h;
}

function stageHTML(s, i){
  const cls = ['step', s.status === 'passed' ? 'done' : s.status === 'current' ? 'now' : 'todo',
               s.gate ? 'gate' : '', i === CUR ? 'open' : ''].join(' ');
  const hot = s.status === 'current';
  const chips = [
    `<span class="chip ${s.status==='passed'?'good':hot?'hot':''}">${esc(s.statusWord||s.status)}</span>`,
    s.attempts ? `<span class="chip">прогонов ${s.attempts}${s.limit ? ' · лимит ' + s.limit : ''}</span>` : '',
    s.tokens ? `<span class="chip">${fmtT(s.tokens)} ток</span>` : '',
    s.cost ? `<span class="chip">$${s.cost.toFixed(2)}</span>` : '',
    s.gate ? `<span class="chip hot">решает человек</span>` : '',
  ].join('');
  const bodyKinds = Object.keys(s.body);
  const tabs = [];
  tabs.push(['in','вход']);
  tabs.push(['out','выход']);
  if (bodyKinds.includes('spec')) tabs.push(['spec','спека · вопросы']);
  if (bodyKinds.includes('review')) tabs.push(['review','проверка']);
  if (bodyKinds.includes('impl')) tabs.push(['impl','реализация']);
  if (bodyKinds.includes('qa')) tabs.push(['qa','качество']);
  const panels = [`<div class="panel" data-p="in">${ioPanel(s,'in')}</div>`,
                  `<div class="panel" data-p="out">${ioPanel(s,'out')}</div>`];
  if (bodyKinds.includes('spec')) panels.push(`<div class="panel" data-p="spec">${specPanel(s.body)}</div>`);
  if (bodyKinds.includes('review')) panels.push(`<div class="panel" data-p="review">${reviewPanel(s.body)}</div>`);
  if (bodyKinds.includes('impl')) panels.push(`<div class="panel" data-p="impl">${implPanel(s.body)}</div>`);
  if (bodyKinds.includes('qa')) panels.push(`<div class="panel" data-p="qa">${qaPanel(s.body)}</div>`);
  return `<div class="${cls}" data-i="${i}">
    <div class="nodebox"><div class="node"><span>${s.status==='passed'?'✓':''}</span></div>
      <div class="rail"></div></div>
    <div>
      <div class="card">
        <div class="head" onclick="toggle(${i})">
          <div class="t1"><span class="role">${esc(s.title)}</span>
            <span class="ver">${esc(s.role||'')}${s.version?'@v'+s.version:''}</span>
            ${chips}</div>
          <div class="t2"><span>${esc(s.duration||'')}</span><span class="caret">▶</span></div>
        </div>
        <div class="body">
          <div class="tabs">${tabs.map(([k,w])=>
            `<div class="tab" data-p="${k}" onclick="tab(event, ${i}, '${k}')">${w}</div>`).join('')}</div>
          ${panels.join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function toggle(i){
  document.querySelectorAll('.step').forEach(el=>{
    el.classList.toggle('open', +el.dataset.i === i ? !el.classList.contains('open') : false);
  });
}
function tab(ev, i, p){
  ev.stopPropagation();
  const step = document.querySelector(`.step[data-i="${i}"]`);
  const on = !step.querySelector(`.tab[data-p="${p}"]`).classList.contains('on');
  step.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  step.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  if (on){
    step.querySelector(`.tab[data-p="${p}"]`).classList.add('on');
    step.querySelector(`.panel[data-p="${p}"]`).classList.add('on');
  }
}
try{
  document.getElementById('s').innerHTML = S.map(stageHTML).join('');
}catch(e){
  document.body.insertAdjacentHTML('beforeend','<pre style="color:#f0616d;padding:20px">ОШИБКА: '+e.message+' | '+e.stack+'</pre>');
}
</script></body></html>
