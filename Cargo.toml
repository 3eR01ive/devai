[workspace]
members = ["crates/devai-core", "crates/devai-store", "crates/devai-runtime", "crates/devai-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
devai-core = { path = "crates/devai-core" }
devai-store = { path = "crates/devai-store" }
devai-runtime = { path = "crates/devai-runtime" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
