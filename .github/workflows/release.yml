name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # --workspace now includes devai-ui (Tauri): its compile deps must
      # exist here too. Bundling the UI app is a separate task (OQ-UI-5).
      - name: system deps (tauri / webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: frontend build (devai-ui)
        run: npm ci && npm run build
        working-directory: crates/devai-ui/frontend
      - name: build (release)
        run: cargo build --release --workspace
      - name: package
        run: |
          set -euo pipefail
          pkg="devai-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$pkg"
          cp target/release/devai "dist/$pkg/"
          # Окно — часть релиза (16.11): без него релиз описывает половину
          # продукта. APK в этот релиз не входит.
          cp target/release/devai-ui "dist/$pkg/"
          cp run-ui.sh "dist/$pkg/"
          # Иконка для ярлыка в меню: установщик кладёт её в пользовательские
          # данные и ссылается на неё из .desktop.
          cp crates/devai-ui/icons/icon.png "dist/$pkg/devai-ui.png"
          cp README.md "dist/$pkg/"
          if [ -f LICENSE ]; then cp LICENSE "dist/$pkg/"; fi
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          (cd dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/devai-*.tar.gz
            dist/devai-*.sha256
          fail_on_missing_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
