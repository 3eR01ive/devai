name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: style gate (cl/style-consistency)
        run: cargo fmt --all -- --check
      # devai-ui (Tauri) is a workspace member (OQ-UI-5 ratified: CI builds
      # the crate with cargo build). Its build needs webkit2gtk-4.1 on Linux
      # (OQ-UI-7 host-parity) and the built frontend assets.
      - name: system deps (tauri / webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: frontend build (devai-ui)
        run: npm ci && npm run build
        working-directory: crates/devai-ui/frontend
      - name: build
        run: cargo build --workspace
      - name: tests
        run: cargo test --workspace
      - name: capture failure output (for public step summary)
        if: failure()
        run: cargo test --workspace 2>&1 | tail -60 >> "$GITHUB_STEP_SUMMARY"
