# Человеческие названия видов артефактов (REQ-NM-01).
#
# Это ДАННЫЕ платформы, а не код: тот же идиом, что `inbox_waits:` и
# `park_reasons:` — merge-scan `workflow/*.yaml` по ключу `artifact_kinds:`
# (devai_store::config::load_artifact_labels). Правка названия меняет
# напечатанную подпись «название · vN» на карточке, в списках и в командной
# строке без пересборки.
#
# Строгость: таблица ОБЯЗАНА покрывать все объявленные виды артефактов;
# пропущенный вид, пустое название или опечатка в ключе — ГРОМКИЙ отказ
# конфигурации `devai init` / чтения, а не молчаливая подстановка машинного
# токена. Технический ключ вида не печатается заголовком нигде.
artifact_kinds:
  labels:
    PROJECT_PROFILE: профиль проекта
    REQUIREMENTS_SPEC: спека
    REVIEW_REPORT: отчёт проверки
    IMPLEMENTATION_PLAN: план реализации
    IMPLEMENTATION_REPORT: отчёт реализации
    PATCH: патч
    TEST_REPORT: отчёт тестов
    QUALITY_REPORT: отчёт качества
    DECISION_RECORD: запись решения
    OTHER: прочее
