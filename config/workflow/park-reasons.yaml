# Почему задача стоит — человеческие слова и предложенное действие
# (task 01a1ca39, REQ-PK-03).
#
# Это ДАННЫЕ платформы, а не код: та же идиома, что `humanize:` и
# `agent_failure:` — слияние по `workflow/*.yaml` по ключу `park_reasons:`.
# Файл объявления правится руками, и правка меняет напечатанный `task status`
# без пересборки. Слова здесь — единственный источник для поверхности
# остановки: машинное имя вида (`rounds_without_shift`, `spawn`,
# `provider_model`) в человеческий вывод не подставляется никогда.
#
# Строгость как у прочих объявлений: каждый вид тормоза, каждый класс отказа,
# который может попасть в ответ, каждая фраза отсутствия и служебное слово
# `actors.platform` ОБЯЗАНЫ здесь присутствовать, а опечатка в ключе — громкая
# ошибка `devai init` и чтения состояния с именем недостающего значения, не
# молчаливый пропуск.
#
# brakes — виды остановки. У каждого вида:
#   `counter` — какая пара чисел журнала ему принадлежит: `brake` (счётчик и
#   порог события `process.parked`), `series` (серия и порог отказа агента) или
#   `none` (счётчика нет);
#   `counter_absent` — ОБЯЗАТЕЛЬНА при `counter: none`: чем заменить пару,
#   чтобы вместо чисел стояли слова, а не выдуманное «0 из 0».
#   rounds_without_shift        — тормоз: круги стадии подряд без нового артефакта
#   consecutive_launch_failures — тормоз: запуски подряд не состоялись
#   park_immediately            — класс отказа объявлен паркующим сразу
#   agent_failure               — порог отказов агента запарковал задачу
#   question                    — задача стоит на вопросе и ждёт человека
#   manual_block/pause/cancel/fail — остановка рукой человека
#
# absence — слова отсутствия факта: вместо чисел и причины печатается фраза,
# а не выдуманный ноль и не пустая строка.
# launch_aftermath — чем кончился несостоявшийся запуск для САМОЙ задачи.
# failure_classes — классы отказа запуска (spawn, platform) и классы отказа
# агента (provider_auth … unclassified).
# actors — авторы записи в человеческих словах; `automatic: true` помечает
# служебного автора платформы (его собственные остановки — не человеческая
# рука). Неизвестный автор печатается как есть: это имя человека.
park_reasons:
  absence:
    counter: "счётчик в событии не записан"
    launch_counter: "счётчик не записан"
    reason: "причина не записана"
  brakes:
    rounds_without_shift:
      why: "сработал тормоз кругов: роль отработала объявленное число кругов подряд, а нового артефакта так и не появилось"
      action: "посмотреть, почему роль не выдаёт результат: уточнить постановку, сменить агента или профиль, затем снять парковку"
      counter: brake
    consecutive_launch_failures:
      why: "сработал тормоз запусков: роль подряд не смогла стартовать объявленное число раз"
      action: "устранить причину запуска — агент, файл драйвера, конфигурацию — и повторить прогон"
      counter: brake
    park_immediately:
      why: "класс отказа объявлен паркующим сразу: повтор этот отказ не исправит"
      action: "устранить названную в причине неисправность и снять парковку вручную"
      counter: brake
    agent_failure:
      why: "отказ агента: серия отказов дошла до объявленного порога"
      action: "устранить причину отказа агента, снять парковку и повторить прогон"
      counter: series
    question:
      why: "задача стоит на вопросе и ждёт ответа человека"
      action: "ответить на открытый вопрос — стадия вернётся, и прогон можно повторить"
      counter: none
      counter_absent: "счётчика нет: задача ждёт ответа человека"
    manual_block:
      why: "задачу остановил человек блокировкой"
      action: "снять блокировку командой `devai task resume`, когда причина устранена"
      counter: none
      counter_absent: "остановлено вручную, счётчика нет"
    manual_pause:
      why: "задачу поставил на паузу человек"
      action: "снять паузу командой `devai task resume`, когда будете готовы продолжить"
      counter: none
      counter_absent: "остановлено вручную, счётчика нет"
    manual_cancel:
      why: "задачу отменил человек"
      action: "ничего делать не нужно: отмена окончательная; при необходимости заведите задачу заново"
      counter: none
      counter_absent: "остановлено вручную, счётчика нет"
    manual_fail:
      why: "задачу перевёл в провал человек"
      action: "снять провал командой `devai task resume`, если работу нужно продолжить"
      counter: none
      counter_absent: "остановлено вручную, счётчика нет"
  launch_aftermath:
    # Запуск не состоялся, и этот отказ запарковал задачу: она стоит.
    parked: "запаркована этим отказом"
    # Запуск не состоялся, задача была запаркована, но сейчас идёт дальше.
    parked_then_going: "этот отказ запарковал задачу; сейчас она идёт дальше"
    # Запуск не состоялся, а задача идёт: отказ не остановил её.
    going: "продолжает идти, запуск не состоялся"
    # Запуск не состоялся, задача уже завершена.
    finished: "задача завершена, запуск не состоялся"
    # Запуск не состоялся, а стоит задача по другой причине (блок остановки).
    held_elsewhere: "запуск не состоялся; остановила задачу другая причина (см. выше)"
    # Событие не записало, запарковало ли оно задачу, — это и говорится.
    unknown: "событие не записало, запарковал ли этот отказ задачу"
  failure_classes:
    spawn:
      why: "платформа не смогла породить процесс роли: нет драйвера или он не запускается"
      action: "проверить путь к драйверу (переменная `DEVAI_RUNNER`) и права на запуск, затем повторить"
    platform:
      why: "раннер роли не ответил, отказал или не смог стартовать в своей области"
      action: "посмотреть журнал раннера и состояние агента, затем повторить прогон"
    provider_auth:
      why: "ключ провайдера отвергнут"
      action: "заменить ключ"
    provider_model:
      why: "модель исчезла у провайдера"
      action: "перевыпустить агента"
    provider_rate:
      why: "провайдер ограничил темп или квоту"
      action: "снизить темп или повторить позже"
    provider_5xx:
      why: "провайдер ответил ошибкой 5xx"
      action: "повторить позже"
    network:
      why: "сеть недоступна"
      action: "проверить сеть"
    config:
      why: "конфигурация нечитаема"
      action: "исправить конфигурацию"
    binary_missing:
      why: "файл драйвера не найден"
      action: "установить файл"
    unclassified:
      why: "причина не классифицирована"
      action: "открыть сохранённый текст ошибки и журнал драйвера"
  # Служебные имена автора записи в человеческих словах. `automatic: true` —
  # остановка записана платформой, а не рукой человека; ровно один автор может
  # быть automatic, и это должен быть токен самой платформы (`platform`), иначе
  # её собственные остановки прочитались бы как человеческие. Неизвестный автор
  # печатается как есть — это имя человека, его переписывать нельзя.
  actors:
    platform:
      word: "платформа"
      automatic: true
