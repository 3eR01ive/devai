# Декларация процесса (REQ-AR-09/11/14/15/16).
#
# Это ДАННЫЕ платформы, а не код: какие состояния существуют, КТО в них
# исполняет (роль или человек), какие исходы у состояния бывают и КУДА они
# ведут, куда уводят удержания и тормоза. Движок НЕ держит второй копии:
# каждое перемещение задачи берёт адрес отсюда (devai_core::process::Process),
# поэтому правка процесса — правка этого объявления, без правки кода.
#
# Условия перехода — ИМЕНА из закрытого перечня ниже (REQ-AR-15), а не
# выражения на языке реализации. Имя принадлежит ОДНОЙ команде, двигающей
# задачу, поэтому пара (состояние, имя) однозначна: `spec_published` — это
# публикация требований, `implementation_reported` — отчёт реализации,
# `review_finished` — вердикт проверяющего.
#
# version ОБЯЗАТЕЛЕН и сверяется при инициализации: дом на другой версии
# объявления получает типизированный отказ, а не тихо живёт по новым правилам
# (REQ-AR-16). Версия 2 добавила адреса удержаний (`holds`) и поимённые
# условия перехода; версия 3 заменила молчаливый тормоз по кругам
# (`max_rounds_without_shift`) пределом попыток без прогресса
# (`brakes.max_attempts_without_progress`). Дому на версии 1 или 2 нужен
# `devai init`.
# Сверка идёт и в обратную сторону: если код платформы двигает
# задачу по ребру, которого здесь нет, `devai init` отказывает — расхождение
# кода и объявления не решается в пользу одной из сторон молча.

process:
  version: 3

  # Закрытый перечень имён условий. Неизвестное имя в transitions отвергается
  # при инициализации — опечатка не становится «новым» переходом. Имя,
  # которое платформа эмитит сама, обязано здесь присутствовать.
  conditions:
    - human_start             # человек запустил дело (DRAFT → первая роль)
    - spec_published          # опубликована версия требований (роль или `revise`)
    - review_finished         # проверяющий закончил с вердиктом «да»
    - review_rejected         # проверяющий вернул требования на доработку
    - human_approved          # человек подписал гейт требований
    - human_rejected          # человек отклонил требования
    - implementation_reported # отчёт реализации лёг (IMPLEMENTATION/REWORK → QA)
    - human_accepted          # человек принял результат (QA → ACCEPTED)
    - human_returned          # человек вернул результат на доработку
    - human_resumed           # человек снял парковку/удержание
    - launch_failed           # запуск роли не состоялся (ошибка порождения)
    - outcome_missing         # у исполнения не пришло исхода (иначе — вечное RUNNING)

  # Рабочие состояния и их исполнители. Для role обязательны launch_failed и
  # outcome_missing (иначе состояние не умеет выразить провал запуска), плюс
  # хотя бы один успешный исход. У каждого объявленного исхода есть переход —
  # непокрытый исход не проходит инициализацию (REQ-AR-14).
  #
  # ВНИМАНИЕ: вид артефакта стадии здесь НЕ объявлен, он живёт в коде
  # (devai-core/src/workflow.rs::stage_artifact_kind: ANALYSIS→спека,
  # REVIEW→отчёт проверки, IMPLEMENTATION/REWORK→отчёт реализации,
  # QA→отчёт качества). Новая стадия роли — правка ДВУХ мест, которые обязаны
  # совпасть: строка `executor: role` здесь и ветка в `stage_artifact_kind`
  # (+ вариант TaskState). Несовпадение не тихое: `devai init` отказывает
  # (validate_role_stage), потому что роль без артефакта стадии не проходится.
  states:
    - state: DRAFT
      executor: none
      outcomes: [human_start]
    - state: ANALYSIS
      executor: role
      role: requirements-analyst
      outcomes: [spec_published, launch_failed, outcome_missing]
    - state: REVIEW
      executor: role
      role: requirements-reviewer
      outcomes: [review_finished, review_rejected, spec_published, launch_failed, outcome_missing]
    - state: APPROVAL
      executor: human
      outcomes: [human_approved, human_rejected, spec_published]
    - state: IMPLEMENTATION
      executor: role
      role: implementation-agent
      outcomes: [implementation_reported, spec_published, launch_failed, outcome_missing]
    - state: REWORK
      executor: role
      role: implementation-agent
      outcomes: [implementation_reported, spec_published, launch_failed, outcome_missing]
    - state: QA
      executor: role
      role: quality-auditor
      outcomes: [human_accepted, human_returned, spec_published, launch_failed, outcome_missing]
    - state: WAITING_FOR_INPUT
      executor: none
      outcomes: [human_resumed]
    - state: PAUSED
      executor: none
      outcomes: [human_resumed]
    - state: BLOCKED
      executor: none
      outcomes: [human_resumed]
    - state: FAILED
      executor: none
      outcomes: [human_resumed]
    - state: ACCEPTED
      executor: none
      outcomes: []
    - state: CANCELLED
      executor: none
      outcomes: []

  # «условие → состояние». RETURN_STATE — особый адрес: вернуть запомненную
  # рабочую стадию (return_state удержания), а не фиксированное состояние.
  transitions:
    - { from: DRAFT, on: human_start, to: ANALYSIS }
    - { from: ANALYSIS, on: spec_published, to: REVIEW }
    - { from: ANALYSIS, on: launch_failed, to: BLOCKED }
    - { from: ANALYSIS, on: outcome_missing, to: BLOCKED }
    - { from: REVIEW, on: spec_published, to: REVIEW }
    - { from: REVIEW, on: review_finished, to: APPROVAL }
    - { from: REVIEW, on: review_rejected, to: ANALYSIS }
    - { from: REVIEW, on: launch_failed, to: BLOCKED }
    - { from: REVIEW, on: outcome_missing, to: BLOCKED }
    - { from: APPROVAL, on: spec_published, to: REVIEW }
    - { from: APPROVAL, on: human_approved, to: IMPLEMENTATION }
    - { from: APPROVAL, on: human_rejected, to: ANALYSIS }
    - { from: IMPLEMENTATION, on: spec_published, to: REVIEW }
    - { from: IMPLEMENTATION, on: implementation_reported, to: QA }
    - { from: IMPLEMENTATION, on: launch_failed, to: BLOCKED }
    - { from: IMPLEMENTATION, on: outcome_missing, to: BLOCKED }
    - { from: REWORK, on: spec_published, to: REVIEW }
    - { from: REWORK, on: implementation_reported, to: QA }
    - { from: REWORK, on: launch_failed, to: BLOCKED }
    - { from: REWORK, on: outcome_missing, to: BLOCKED }
    - { from: QA, on: spec_published, to: REVIEW }
    - { from: QA, on: human_accepted, to: ACCEPTED }
    - { from: QA, on: human_returned, to: REWORK }
    - { from: QA, on: launch_failed, to: BLOCKED }
    - { from: QA, on: outcome_missing, to: BLOCKED }
    - { from: WAITING_FOR_INPUT, on: human_resumed, to: RETURN_STATE }
    - { from: PAUSED, on: human_resumed, to: RETURN_STATE }
    - { from: BLOCKED, on: human_resumed, to: RETURN_STATE }
    - { from: FAILED, on: human_resumed, to: RETURN_STATE }

  # Куда уводит удержание — тоже данные, а не адрес в коде: пауза, блокировка,
  # отмена, провал и вопрос паркуют задачу в объявленное состояние. Все адреса
  # обязаны быть состояниями-удержаниями (снимает их только человек).
  holds:
    pause: PAUSED
    block: BLOCKED
    cancel: CANCELLED
    fail: FAILED
    question: WAITING_FOR_INPUT

  # Предел попыток роли без прогресса (REQ-AL-04). Число — ДАННЫЕ: правка
  # здесь действует со следующего запуска, код своего числа не держит.
  #
  # ЭТОТ ПРЕДЕЛ — ЗАМЕНА снятого молчаливого тормоза по кругам
  # (`max_rounds_without_shift`): один тормоз, одно число. Старый считал
  # «круг без нового артефакта» и парковал задачу БЕЗ вопроса; этот считает
  # попытки одной роли, виден в статусе и карточке и останавливает задачу
  # ОДНИМ вопросом человеку, а не тихой парковкой.
  #
  # Границы: попытка — один запуск стадии роли (служебные повторы формы — та
  # же попытка); предел действует МЕЖДУ прогонами и проверяется перед
  # запуском, внутрь идущего прогона не вмешивается; 16 шагов внутри прогона
  # остаются как есть. Счётчик живёт на паре «задача + роль»: запуск другой
  # роли его не увеличивает и не сбрасывает.
  #
  # Прогресс — сдвиг по существу, а не новая версия с другим текстом: круг,
  # который сходимость стадии признала движением (оценка растёт), смена
  # сохранённого вердикта или выход роли в состояние, которого задача ещё не
  # достигала. Повтор того же круга (ANALYSIS↔REVIEW, QA↔REWORK) прогрессом НЕ
  # считается и предел увеличивает — иначе петля крутится вечно.
  #
  # 5 в поставке; 0 или пустое значение — «без предела»; отрицательное или
  # нечисловое значение — громкий отказ инициализации с именем ключа.
  # Достижение предела — остановка с ОДНИМ вопросом человеку (продолжить /
  # остановить), автоматических продолжений и автосмены роли нет; сбрасывает
  # счётчик только человеческий ответ «продолжить».
  brakes:
    max_attempts_without_progress: 5
    max_consecutive_failures: 3   # несостоявшихся запусков подряд
    # Классы отказов, паркующие СРАЗУ, первым же случаем (REQ-AR-09):
    # платформа и провайдер повтором не починятся — решает человек.
    # Имена — из закрытого перечня классов отказа; неизвестное отвергается
    # при инициализации, а не молча не срабатывает.
    park_immediately: [platform, provider]
    park_state: BLOCKED
