[package]
name = "devai-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "devai-ui: Tauri desktop consumer of the platform API — read-only operator surface (dogfoods REQ-API-08: a second consumer with no store access)"

# REQ-UI-02 (AC1): the UI depends ONLY on the published API surface.
# devai-store and rusqlite are absent from this graph BY CONSTRUCTION —
# direct deps below are the whole surface the crate can reach. devai-core
# supplies the domain vocabulary types (Task/TaskState tokens) for the
# inbox filter; it performs no IO (core's own doctrine).
[lib]
# Мобильной сборке Tauri нужен статический/динамический lib-таргет с
# `mobile_entry_point`; десктоп использует тот же код как rlib из main.rs.
name = "devai_ui"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
chrono.workspace = true
serde.workspace = true
# REQ-GATE-04: the APPROVAL presentation reads the REQUIREMENTS_SPEC JSON
# body (published artifact.cat_text output) — parsing only, never rewrite.
serde_json.workspace = true
dirs.workspace = true
devai-core.workspace = true
devai-api.workspace = true
tauri = { version = "2", features = [] }
# R1 (operator, rework of the homes cycle): the native folder picker for
# adding a home (REQ-HOME-03 «диалог выбора пути»). Connected by the stock
# plugin pattern: crate dep here, init in main.rs, `dialog:allow-open` in
# capabilities/default.json, `@tauri-apps/plugin-dialog` on the frontend.
tauri-plugin-dialog = "2"
# REQ-LAN (task 01a1be98): the phone talks to the SAME command plane over a
# local HTTP surface. axum is a sync-friendly embeddable server;
# qrcode renders the invitation as an SVG string, so the frontend needs no
# QR dependency of its own; libc reads the machine's interface list
# (getifaddrs) for the LAN binding and the network-change watchdog.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2"
# REQ-QRAPP-02: the invitation link is a `devai://pair` scheme. On Android the
# plugin's build script writes the intent-filter into the generated manifest
# from `tauri.conf.json > plugins > deep-link`, and its Kotlin side forwards a
# scanned link to Rust while the app runs; a cold start is read with
# `get_current`. No manifest is edited by hand.
tauri-plugin-deep-link = "2"

[dev-dependencies]
# R4: the ipc serde-output snapshot fixtures are compared as JSON.
serde_json.workspace = true
# R1 return (startup-path regression): the session test stages a temp
# control home and an old-schema home from an inert fixture.
tempfile = "3"
# The HTTP boundary is exercised through the axum Router itself (`oneshot`):
# the whole extractor path (ConnectInfo, Query, cookies, body) runs, and the
# test needs no socket of its own.
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true
